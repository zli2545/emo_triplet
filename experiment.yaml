# Formal configuration for the selected emotion-triplet study.
# This directory contains the generated static experiment files.
# If shared template code changes, regenerate this study from the
# triplet_experiment_template repository and replace the generated files.

stimuli_dir: assets/stimuli

page_title: "Emotion Triplet Study"

response_mode: keyboard
response_keys: [k, l]

# Formal study totals: 960 random + 90 validation + 30 check.
n_random_trials: 960
n_validation_trials: 90
n_check_trials: 30
n_main_trials: 1080

# The 90 validation trials are generated once below and then kept fixed for
# every participant. They must not be regenerated for each participant.

